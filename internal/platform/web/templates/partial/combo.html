{{define "partial/combo"}}
<div class="combo">
  <div class="input-group input-group-sm">
    <input class="form-control form-control-sm combo-input" name="{{.name}}" value="{{.value}}"
      placeholder="{{.placeholder}}" autocomplete="off">
    <button type="button" class="btn btn-sm btn-outline-secondary combo-toggle" title="展开选项">▾</button>
  </div>
  <div class="combo-list" hidden>
    {{range .options}}<button type="button" class="combo-item" data-value="{{.}}">{{.}}</button>{{end}}
  </div>
</div>
{{end}}
