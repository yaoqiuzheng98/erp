{{define "partial/sysnav"}}
<nav class="sidebar offcanvas-md offcanvas-start p-2 d-flex flex-column" id="sysnav" tabindex="-1">
  <div class="d-md-none d-flex justify-content-between align-items-center px-2 pt-1">
    <span class="fw-bold text-white-50 small">菜单</span>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sysnav" aria-label="关闭"></button>
  </div>
  <a class="fs-5 fw-bold text-white px-2 py-2 mb-1" href="/sysadmin">门诊平台</a>
  <a href="/sysadmin" {{if eq .Path "/sysadmin"}}class="active"{{end}}>概览</a>
  <a href="/sysadmin/tenants" {{if eq .Path "/sysadmin/tenants"}}class="active"{{end}}>门诊管理</a>
  <a href="/sysadmin/audit" {{if eq .Path "/sysadmin/audit"}}class="active"{{end}}>全局审计</a>
</nav>
{{end}}

{{define "partial/systop"}}
<div class="topbar d-flex justify-content-between align-items-center px-3 px-md-4 py-2">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-sm btn-outline-secondary d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sysnav" aria-controls="sysnav" aria-label="菜单">☰</button>
    <span class="text-muted small topbar-path">{{if .Title}}{{.Title}}{{else}}{{.Path}}{{end}}</span>
  </div>
  <div class="d-flex align-items-center gap-2 gap-md-3">
    <div class="dropdown">
      <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" title="账号菜单">
        👤 <span class="topbar-user">{{if .Sys}}{{.Sys.Username}}{{end}}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><h6 class="dropdown-header">{{if .Sys}}{{.Sys.Username}}{{end}}<br><small class="text-muted">系统超管</small></h6></li>
        <li><hr class="dropdown-divider"></li>
        <li><form method="post" action="/sysadmin/logout" class="m-0" onsubmit="return confirm('确认退出登录？')">
          <input type="hidden" name="_csrf" value="{{.CSRF}}">
          <button class="dropdown-item">退出登录</button>
        </form></li>
      </ul>
    </div>
  </div>
</div>
{{end}}
