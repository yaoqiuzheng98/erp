{{define "partial/sysnav"}}
<nav class="sidebar p-2 d-flex flex-column">
  <a class="fs-5 fw-bold text-white px-2 py-2 mb-1" href="/sysadmin">ERP 平台</a>
  <a href="/sysadmin" {{if eq .Path "/sysadmin"}}class="active"{{end}}>概览</a>
  <a href="/sysadmin/tenants" {{if eq .Path "/sysadmin/tenants"}}class="active"{{end}}>租户管理</a>
  <a href="/sysadmin/plugins" {{if eq .Path "/sysadmin/plugins"}}class="active"{{end}}>插件目录</a>
  <a href="/sysadmin/audit" {{if eq .Path "/sysadmin/audit"}}class="active"{{end}}>全局审计</a>
</nav>
{{end}}

{{define "partial/systop"}}
<div class="topbar d-flex justify-content-between align-items-center px-4 py-2">
  <span class="text-muted small">{{.Path}}</span>
  <div class="d-flex align-items-center gap-3">
    <span class="text-dark">{{if .Sys}}{{.Sys.Username}}{{end}}</span>
    <form method="post" action="/sysadmin/logout" class="m-0">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <button class="btn btn-sm btn-outline-secondary">退出</button>
    </form>
  </div>
</div>
{{end}}
