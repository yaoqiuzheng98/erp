{{define "partial/foot"}}
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/htmx.min.js"></script>
<script>
  document.body.addEventListener('htmx:configRequest', function (e) {
    e.detail.headers['X-CSRF-Token'] = '{{.CSRF}}';
  });
  function autoDismiss(root) {
    (root.querySelectorAll ? root : document).querySelectorAll('.alert-dismissible.fade.show').forEach(function (el) {
      if (el.dataset.autoDismiss) return;
      el.dataset.autoDismiss = '1';
      setTimeout(function () {
        var inst = bootstrap.Alert.getOrCreateInstance(el);
        if (inst) inst.close();
      }, 4000);
    });
  }
  document.addEventListener('htmx:load', function (e) { autoDismiss(e.detail.elt); });
  autoDismiss(document.body);
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.dataset.submitting) { e.preventDefault(); return; }
    f.dataset.submitting = '1';
    var b = e.submitter || f.querySelector('button[type="submit"], button:not([type])');
    if (b) b.disabled = true;
  });
  window.addEventListener('pageshow', function () {
    document.querySelectorAll('form[data-submitting]').forEach(function (f) {
      delete f.dataset.submitting;
      f.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
    });
  });
  // combo：输入框自由输入，下拉箭头永远展开全量选项
  document.querySelectorAll('.combo').forEach(function (box) {
    if (box.dataset.comboInit) return;
    box.dataset.comboInit = '1';
    var input = box.querySelector('.combo-input');
    var list = box.querySelector('.combo-list');
    var items = Array.prototype.slice.call(list.querySelectorAll('.combo-item'));
    function show(all) {
      var q = all ? '' : input.value.trim();
      var shown = 0;
      items.forEach(function (it) {
        var hit = !q || it.dataset.value.indexOf(q) !== -1;
        it.style.display = hit ? '' : 'none';
        if (hit) shown++;
      });
      list.hidden = shown === 0;
    }
    box.querySelector('.combo-toggle').addEventListener('click', function (e) {
      e.stopPropagation();
      if (list.hidden) show(true); else list.hidden = true;
    });
    input.addEventListener('input', function () { show(false); });
    input.addEventListener('focus', function () { show(false); });
    list.addEventListener('mousedown', function (e) {
      var it = e.target.closest('.combo-item');
      if (it) { input.value = it.dataset.value; list.hidden = true; }
    });
    document.addEventListener('click', function (e) {
      if (!box.contains(e.target)) list.hidden = true;
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') list.hidden = true;
    });
  });
</script>
{{end}}
