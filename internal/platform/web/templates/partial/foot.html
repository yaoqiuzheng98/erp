{{define "partial/foot"}}
<button id="backTop" class="btn btn-secondary" title="回到顶部" aria-label="回到顶部">↑</button>
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/htmx.min.js"></script>
<script>
  document.body.addEventListener('htmx:configRequest', function (e) {
    e.detail.headers['X-CSRF-Token'] = '{{.CSRF}}';
  });
  function autoDismiss(root) {
    (root.querySelectorAll ? root : document).querySelectorAll('.alert-dismissible.fade.show').forEach(function (el) {
      if (el.dataset.autoDismiss) return;
      el.dataset.autoDismiss = '1';
      setTimeout(function () {
        var inst = bootstrap.Alert.getOrCreateInstance(el);
        if (inst) inst.close();
      }, 4000);
    });
  }
  document.addEventListener('htmx:load', function (e) { autoDismiss(e.detail.elt); });
  autoDismiss(document.body);
  // 防重复提交：同一表单提交中再点直接拦掉；提交按钮变“提交中…”并禁用。
  // 带 confirm 的表单点取消时不锁（defaultPrevented 时回滚），后退回来时 pageshow 复位。
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!(f instanceof HTMLFormElement)) return;
    if (f.dataset.submitting) { e.preventDefault(); return; }
    f.dataset.submitting = '1';
    setTimeout(function () {
      if (e.defaultPrevented) { delete f.dataset.submitting; return; }
      var b = e.submitter || f.querySelector('button[type="submit"], button:not([type])');
      if (b && b.classList.contains('btn')) {
        if (b.textContent.trim()) { b.dataset.label = b.textContent; b.textContent = '提交中…'; }
        b.disabled = true;
      }
    }, 0);
  });
  window.addEventListener('pageshow', function () {
    document.querySelectorAll('form[data-submitting]').forEach(function (f) {
      delete f.dataset.submitting;
      f.querySelectorAll('button').forEach(function (b) {
        b.disabled = false;
        if (b.dataset.label) { b.textContent = b.dataset.label; delete b.dataset.label; }
      });
    });
  });
  // 回顶按钮：滚过一屏才出现
  (function () {
    var btn = document.getElementById('backTop');
    if (!btn) return;
    window.addEventListener('scroll', function () {
      btn.style.display = window.scrollY > 480 ? 'block' : 'none';
    }, { passive: true });
    btn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  })();
  // datalist：有值时点开也展开全量选项（聚焦暂存清空，未选则恢复；
  // 已聚焦时再点没有 focus 事件，用 mousedown 补）
  document.querySelectorAll('input[list]').forEach(function (el) {
    if (el.dataset.dlInit) return;
    el.dataset.dlInit = '1';
    function clearForList() {
      el.dataset.saved = el.value;
      el.dataset.picked = '';
      el.value = '';
    }
    el.addEventListener('focus', clearForList);
    el.addEventListener('mousedown', function () {
      if (document.activeElement === el) clearForList();
    });
    el.addEventListener('input', function () { el.dataset.picked = '1'; });
    el.addEventListener('blur', function () {
      if (!el.dataset.picked && el.value === '') el.value = el.dataset.saved || '';
    });
  });
</script>
{{end}}
