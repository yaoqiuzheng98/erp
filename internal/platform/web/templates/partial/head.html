{{define "partial/head"}}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}ERP</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <style>
    body { background: #f5f6f8; }
    /* 品牌色（与患者端同系）：主按钮青绿，侧边栏深青渐变 */
    .btn-primary {
      --bs-btn-bg: #0d9488; --bs-btn-border-color: #0d9488;
      --bs-btn-hover-bg: #0f766e; --bs-btn-hover-border-color: #0f766e;
      --bs-btn-active-bg: #115e59; --bs-btn-active-border-color: #115e59;
      --bs-btn-disabled-bg: #0d9488; --bs-btn-disabled-border-color: #0d9488;
    }
    .btn-outline-primary {
      --bs-btn-color: #0d9488; --bs-btn-border-color: #0d9488;
      --bs-btn-hover-bg: #0d9488; --bs-btn-hover-border-color: #0d9488;
      --bs-btn-active-bg: #0f766e; --bs-btn-active-border-color: #0f766e;
    }
    .sidebar { width: 220px; min-height: 100vh; background: linear-gradient(180deg, #0f766e, #134e4a) !important; overflow-y: auto; }
    /* 手机端 offcanvas 抽屉内菜单过长时可滚动 */
    .offcanvas-md.sidebar { max-height: 100vh; }
    .sidebar a { color: #d7ebe8; text-decoration: none; display: block; padding: .45rem 1rem; border-radius: .375rem; }
    .sidebar a:hover, .sidebar a.active { color: #fff; background: rgba(255,255,255,.15); }
    .sidebar .nav-group { color: rgba(255,255,255,.55); font-size: .78rem; padding: .9rem 1rem .25rem; text-transform: uppercase; }
    .sidebar .text-white-50 { color: rgba(255,255,255,.6) !important; }
    .topbar { background: #fff; border-bottom: 1px solid #dee2e6; position: sticky; top: 0; z-index: 1020; }
    /* 长列表表头吸顶（横滑wrapper内不生效时至少回顶按钮可用） */
    .table-responsive thead th { position: sticky; top: 0; background: #fff; z-index: 1; }
    /* 金额语义色：欠费红 / 已收绿 */
    .amt-unpaid { color: #dc3545; font-weight: 700; }
    .amt-paid { color: #198754; font-weight: 700; }
    /* 回顶按钮 */
    #backTop { position: fixed; right: 1rem; bottom: 1.5rem; z-index: 1040; display: none;
      width: 2.75rem; height: 2.75rem; border-radius: 50%; padding: 0; font-size: 1.25rem; }
    @media (max-width: 767.98px) {
      /* 手机端操作按钮放大，触控更稳 */
      main .btn-sm { padding: .5rem .8rem; font-size: .95rem; }
    }
    .topbar > div { min-width: 0; }
    .topbar a, .topbar span, .topbar button { white-space: nowrap; }
    .topbar .topbar-path { overflow: hidden; text-overflow: ellipsis; }
    .topbar .topbar-user { display: inline-block; max-width: 14em; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
    .btn { white-space: nowrap; }
    .flash-toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 1090; max-width: min(400px, calc(100vw - 32px)); background: rgba(33,37,41,.92); color: #fff; border: 0; box-shadow: 0 .5rem 1rem rgba(0,0,0,.2); }
    .d-flex > .flex-grow-1 { min-width: 0; }
    /* 患者端：App 感 */
    body.portal { background: #eef4f3; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; }
    body.portal main { flex: 1 0 auto; padding-bottom: 24px; }
    .portal-hero { background: linear-gradient(135deg, #0d9488, #0f766e); color: #fff;
      border-radius: 1rem; }
    .portal-tabbar { position: sticky; bottom: 0; z-index: 1030;
      background: #fff; border-top: 1px solid #dee2e6;
      display: flex; padding: .4rem 0 calc(.4rem + env(safe-area-inset-bottom)); }
    .portal-tabbar a { flex: 1; text-align: center; text-decoration: none;
      color: #6c757d; font-size: .72rem; line-height: 1.5; }
    .portal-tabbar a .ico { display: block; font-size: 1.25rem; }
    .portal-tabbar a.active { color: #0d9488; font-weight: 700; }
    .portal-topbar { background: #fff; }
    .portal-card { border: 0; border-radius: 1rem; box-shadow: 0 .125rem .5rem rgba(0,0,0,.06); }
    /* 首页画廊：图片组从左往右缓慢轮播（内容复制一份实现无缝循环） */
    .gallery-track { overflow: hidden; }
    .gallery-scroll { display: flex; gap: .5rem; width: max-content;
      animation: gallery-slide 30s linear infinite; }
    .gallery-track:active .gallery-scroll { animation-play-state: paused; }
    @keyframes gallery-slide { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    @media (max-width: 767.98px) {
      .topbar .topbar-user { max-width: 7em; }
      .table-responsive .table th, .table-responsive .table td { white-space: nowrap; }
    }
  </style>
</head>
{{end}}
