{{define "portal/nav"}}
<div class="portal-topbar d-flex justify-content-between align-items-center px-3 py-2 sticky-top">
  <span class="fw-bold">{{.Data.Clinic}}</span>
  <span class="text-muted small">{{.Data.NavTitle}}</span>
</div>
{{end}}

{{define "portal/tabbar"}}
<nav class="portal-tabbar">
  <a href="/p/{{.Data.Tid}}/" class="{{if eq .Data.Tab "home"}}active{{end}}"><span class="ico">🏠</span>首页</a>
  <a href="/p/{{.Data.Tid}}/book" class="{{if eq .Data.Tab "book"}}active{{end}}"><span class="ico">📅</span>挂号</a>
  <a href="/p/{{.Data.Tid}}/services" class="{{if eq .Data.Tab "services"}}active{{end}}"><span class="ico">💰</span>价目</a>
  <a href="/p/{{.Data.Tid}}/my" class="{{if eq .Data.Tab "my"}}active{{end}}"><span class="ico">👤</span>我的</a>
</nav>
{{end}}
