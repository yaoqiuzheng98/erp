{{define "portal/login"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body class="portal d-flex align-items-center justify-content-center" style="min-height:100vh">
<div style="width:360px;max-width:calc(100vw - 32px)">
  <div class="text-center mb-4">
    <div style="font-size:3rem">🦷</div>
    <h4 class="mt-2 mb-1">{{.Data.Clinic}}</h4>
    <div class="text-muted small">患者登录 · 初次使用请到门诊前台设置密码</div>
  </div>
  <div class="card portal-card"><div class="card-body p-4">
    {{if .Data.Err}}<div class="alert alert-danger py-2">{{.Data.Err}}</div>{{end}}
    <form method="post" action="/p/{{.Data.Tid}}/login">
      <div class="mb-3">
        <label class="form-label">手机号</label>
        <input class="form-control form-control-lg" name="phone" inputmode="tel" required pattern="1[3-9][0-9]{9}" title="11 位大陆手机号" autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input class="form-control form-control-lg" type="password" name="password" required>
      </div>
      <button class="btn btn-primary btn-lg w-100">登录</button>
    </form>
  </div></div>
</div>
{{template "partial/foot" .}}
</body>
</html>
{{end}}
