{{define "portal/login"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card shadow-sm" style="width:360px;max-width:calc(100vw - 32px)">
  <div class="card-body p-4">
    <h4 class="mb-1 text-center">患者登录</h4>
    <p class="text-muted small text-center">初次使用请到门诊前台设置密码</p>
    {{if .Data.Err}}<div class="alert alert-danger py-2">{{.Data.Err}}</div>{{end}}
    <form method="post" action="/p/{{.Data.Code}}/login">
      <div class="mb-3">
        <label class="form-label">手机号</label>
        <input class="form-control" name="phone" inputmode="tel" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input class="form-control" type="password" name="password" required>
      </div>
      <button class="btn btn-primary w-100">登录</button>
    </form>
  </div>
</div>
{{template "partial/foot" .}}
</body>
</html>
{{end}}
