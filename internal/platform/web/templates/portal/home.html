{{define "portal/home"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body class="portal">
{{template "portal/nav" .}}
<main class="p-3">
  {{template "partial/flash" .}}
  <div class="portal-hero p-3 mb-3">
    <div class="small opacity-75">{{.Data.Clinic}}</div>
    <h4 class="mb-0">{{.Data.Name}}，你好 🦷</h4>
  </div>
  <div class="d-grid gap-2">
    <a class="btn btn-primary btn-lg py-3" href="/p/{{.Data.Tid}}/appointments">🧾 我的预约</a>
    <a class="btn btn-outline-primary btn-lg py-3" href="/p/{{.Data.Tid}}/bills">💰 我的账单</a>
  </div>
</main>
{{template "portal/tabbar" .}}
{{template "partial/foot" .}}
</body>
</html>
{{end}}
