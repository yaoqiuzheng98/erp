{{define "portal/book"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body class="portal">
{{template "portal/nav" .}}
<main class="p-3">
  {{template "partial/flash" .}}
  <form method="post" action="/p/{{.Data.Tid}}/book">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <div class="card portal-card mb-2"><div class="card-body">
      <div class="mb-2"><label class="form-label">接诊医生</label>
        <select class="form-select form-select-lg" name="doctor_id" required>
          <option value="">选择医生</option>
          {{range .Data.Doctors}}<option value="{{hex .ID}}">{{.Name}}</option>{{end}}
        </select></div>
      <div class="row g-2">
        <div class="col-6"><label class="form-label">日期</label>
          <input class="form-control form-control-lg" name="date" type="date" required></div>
        <div class="col-6"><label class="form-label">时间</label>
          <input class="form-control form-control-lg" name="slot" type="time" required></div>
      </div>
    </div></div>
    <div class="card portal-card mb-2"><div class="card-body">
      <div><label class="form-label">哪里不舒服</label>
        <textarea class="form-control" name="item" rows="3" required
          placeholder="如：左上后牙阵痛三天，遇冷加重"></textarea></div>
      <div class="small text-muted mt-1">具体做什么项目由医生面诊后定。</div>
    </div></div>
    <button class="btn btn-primary btn-lg w-100">提交预约</button>
  </form>
</main>
{{template "portal/tabbar" .}}
{{template "partial/foot" .}}
</body>
</html>
{{end}}
