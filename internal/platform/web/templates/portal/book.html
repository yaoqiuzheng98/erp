{{define "portal/book"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body>
<div class="topbar d-flex justify-content-between align-items-center px-3 py-2">
  <a class="text-decoration-none" href="/p/{{.Data.Tid}}/">‹ 返回</a>
  <span class="fw-bold">预约挂号</span>
  <span style="width:3em"></span>
</div>
<main class="p-3">
  {{template "partial/flash" .}}
  <form method="post" action="/p/{{.Data.Tid}}/book">
    <div class="mb-2"><label class="form-label">接诊医生</label>
      <select class="form-select" name="doctor_id" required>
        <option value="">选择医生</option>
        {{range .Data.Doctors}}<option value="{{hex .ID}}">{{.Name}}</option>{{end}}
      </select></div>
    <div class="row g-2 mb-2">
      <div class="col-6"><label class="form-label">日期</label>
        <input class="form-control" name="date" type="date" required></div>
      <div class="col-6"><label class="form-label">时间</label>
        <input class="form-control" name="slot" type="time" required></div>
    </div>
    <div class="mb-2"><label class="form-label">诊疗项目（可多选）</label>
      <div class="border rounded p-2 d-flex flex-wrap gap-2" style="max-height:14em;overflow:auto">
        {{range .Data.Services}}
        <label class="form-check form-check-inline m-0 border rounded px-2 py-1 bg-light">
          <input class="form-check-input" type="checkbox" name="service_id" value="{{hex .ID}}">
          {{.Name}} ¥{{printf "%.2f" .Price}}
          <input class="form-control form-control-sm d-inline ms-1" name="qty_{{hex .ID}}"
                 type="number" min="1" step="1" value="1" style="width:4em">
        </label>
        {{else}}
        <span class="text-muted small">暂无价目</span>
        {{end}}
      </div></div>
    <div class="mb-3"><label class="form-label">备注</label>
      <input class="form-control" name="item" placeholder="症状补充（选填）"></div>
    <button class="btn btn-primary w-100">提交预约</button>
  </form>
</main>
{{template "partial/foot" .}}
</body>
</html>
{{end}}
