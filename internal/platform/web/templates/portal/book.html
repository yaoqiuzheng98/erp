{{define "portal/book"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body class="portal">
{{template "portal/nav" .}}
<main class="p-3">
  {{template "partial/flash" .}}
  <div class="mb-1"><a href="/p/{{.Data.Tid}}/" class="text-decoration-none small">&lt; 返回首页</a></div>
  <form method="post" action="/p/{{.Data.Tid}}/book">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <div class="card portal-card mb-2"><div class="card-body">
      <div class="row g-2">
        <div class="col-6"><label class="form-label">日期</label>
          <input class="form-control form-control-lg" name="date" type="date" required min="{{.Data.Today}}"></div>
        <div class="col-6"><label class="form-label">时段</label>
          <select class="form-control form-control-lg" name="slot" required>
            <option value="">选择时段</option>
            {{range .Data.Slots}}<option value="{{.Value}}">{{.Label}}</option>{{end}}
          </select></div>
      </div>
    </div></div>
    <button class="btn btn-primary btn-lg w-100">提交预约</button>
  </form>
</main>
{{template "portal/tabbar" .}}
{{template "partial/foot" .}}
</body>
</html>
{{end}}
