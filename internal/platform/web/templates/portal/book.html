{{define "portal/book"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body class="portal">
{{template "portal/nav" .}}
<main class="p-3">
  {{template "partial/flash" .}}
  <form method="post" action="/p/{{.Data.Tid}}/book">
    <div class="card portal-card mb-2"><div class="card-body">
      <div class="mb-2"><label class="form-label">接诊医生</label>
        <select class="form-select form-select-lg" name="doctor_id" required>
          <option value="">选择医生</option>
          {{range .Data.Doctors}}<option value="{{hex .ID}}">{{.Name}}</option>{{end}}
        </select></div>
      <div class="row g-2">
        <div class="col-6"><label class="form-label">日期</label>
          <input class="form-control form-control-lg" name="date" type="date" required></div>
        <div class="col-6"><label class="form-label">时间</label>
          <input class="form-control form-control-lg" name="slot" type="time" required></div>
      </div>
    </div></div>
    <div class="card portal-card mb-2"><div class="card-body">
      <label class="form-label">诊疗项目（可多选）</label>
      <div class="d-flex flex-wrap gap-2">
        {{range .Data.Services}}
        <label class="form-check border rounded px-2 py-1 bg-light">
          <input class="form-check-input" type="checkbox" name="service_id" value="{{hex .ID}}">
          {{.Name}} ¥{{printf "%.2f" .Price}}
          <input class="form-control form-control-sm d-inline ms-1" name="qty_{{hex .ID}}"
                 type="number" min="1" step="1" value="1" style="width:3.5em">
        </label>
        {{else}}
        <span class="text-muted small">暂无价目</span>
        {{end}}
      </div>
      <div class="mt-2"><label class="form-label">备注</label>
        <input class="form-control" name="item" placeholder="症状补充（选填）"></div>
    </div></div>
    <button class="btn btn-primary btn-lg w-100">提交预约</button>
  </form>
</main>
{{template "portal/tabbar" .}}
{{template "partial/foot" .}}
</body>
</html>
{{end}}
