{{define "portal/services"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body class="portal">
{{template "portal/nav" .}}
<main class="p-2">
  <div class="table-responsive"><table class="table table-sm bg-white text-nowrap mb-0">
    <thead><tr><th>项目</th><th>分类</th><th>单价</th></tr></thead>
    <tbody>
    {{range .Data.Rows}}
    <tr><td>{{.Name}}</td><td>{{.Category}}</td><td>¥{{printf "%.2f" .Price}}{{if .Unit}}/{{.Unit}}{{end}}</td></tr>
    {{else}}
    <tr><td colspan="3" class="text-muted">暂无价目</td></tr>
    {{end}}
    </tbody>
  </table></div>
</main>
{{template "portal/tabbar" .}}
{{template "partial/foot" .}}
</body>
</html>
{{end}}
