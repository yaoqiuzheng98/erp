{{define "portal/my"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body class="portal">
{{template "portal/nav" .}}
<main class="p-3">
  {{template "partial/flash" .}}
  <div class="card portal-card mb-3"><div class="card-body">
    <h5 class="mb-1">{{.Data.Name}}</h5>
    <div class="text-muted small">{{.Data.Phone}} · {{.Data.Clinic}}</div>
  </div></div>
  <form method="post" action="/p/{{.Data.Tid}}/logout" class="m-0">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <button class="btn btn-link btn-sm text-muted w-100">退出登录</button>
  </form>
</main>
{{template "portal/tabbar" .}}
{{template "partial/foot" .}}
</body>
</html>
{{end}}
