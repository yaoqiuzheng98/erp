{{define "login"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card shadow-sm" style="width:360px">
  <div class="card-body p-4">
    <h4 class="mb-3 text-center">门诊登录</h4>
    {{if .Data}}{{if .Data.Err}}<div class="alert alert-danger py-2">{{.Data.Err}}</div>{{end}}{{end}}
    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label">门诊名称</label>
        <input class="form-control" name="tenant" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">手机号</label>
        <input class="form-control" name="phone" inputmode="tel" required pattern="1[3-9][0-9]{9}" title="11 位大陆手机号" autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input class="form-control" type="password" name="password" required>
      </div>
      <button class="btn btn-primary w-100">登录</button>
    </form>
  </div>
</div>
{{template "partial/foot" .}}
</body>
</html>
{{end}}
