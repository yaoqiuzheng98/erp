{{define "app/password"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body>
<div class="d-flex">
  {{template "partial/appnav" .}}
  <div class="flex-grow-1">
    {{template "partial/apptop" .}}
    <main class="p-2 p-md-4">
      {{template "partial/flash" .}}
      <h4 class="mb-3">修改密码</h4>
      <div class="card" style="max-width:420px"><div class="card-body">
        <form method="post" action="/app/password">
          <input type="hidden" name="_csrf" value="{{.CSRF}}">
          <div class="mb-2"><label class="form-label">原密码</label>
            <input class="form-control form-control-sm" type="password" name="old_password" required autofocus></div>
          <div class="mb-2"><label class="form-label">新密码</label>
            <input class="form-control form-control-sm" type="password" name="new_password" required minlength="6"></div>
          <div class="mb-2"><label class="form-label">确认新密码</label>
            <input class="form-control form-control-sm" type="password" name="confirm_password" required minlength="6"></div>
          <button class="btn btn-sm btn-primary">保存</button>
        </form>
      </div></div>
    </main>
  </div>
</div>
{{template "partial/foot" .}}
</body>
</html>
{{end}}
