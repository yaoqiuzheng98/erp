{{define "sys/audit"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body>
<div class="d-flex">
  {{template "partial/sysnav" .}}
  <div class="flex-grow-1">
    {{template "partial/systop" .}}
    <main class="p-2 p-md-4">
      <h4 class="mb-3">全局审计日志</h4>
      <div class="table-responsive"><table class="table table-sm bg-white">
        <thead><tr><th>时间</th><th>租户</th><th>用户</th><th>操作</th><th>对象</th><th>详情</th><th>IP</th></tr></thead>
        <tbody>
        {{range .Data.Logs}}
        <tr>
          <td>{{date .At}}</td><td class="small text-muted">{{hex .TenantID}}</td>
          <td>{{.Username}}</td><td>{{.Action}}</td><td>{{.Target}}</td>
          <td class="small text-muted">{{.Detail}}</td><td>{{.IP}}</td>
        </tr>
        {{end}}
        </tbody>
      </table></div>
    </main>
  </div>
</div>
{{template "partial/foot" .}}
</body>
</html>
{{end}}
