{{define "sys/tenants"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body>
<div class="d-flex">
  {{template "partial/sysnav" .}}
  <div class="flex-grow-1">
    {{template "partial/systop" .}}
    <main class="p-2 p-md-4">
      {{template "partial/flash" .}}
      <h4 class="mb-3">租户管理</h4>
      <div class="card mb-4"><div class="card-body">
        <form method="post" action="/sysadmin/tenants" class="row g-2 align-items-end">
          <input type="hidden" name="_csrf" value="{{.CSRF}}">
          <div class="col-auto"><label class="form-label">企业名称</label>
            <input class="form-control form-control-sm" name="name" required></div>
          <div class="col-auto"><label class="form-label">编码</label>
            <input class="form-control form-control-sm" name="code" required></div>
          <div class="col-auto"><label class="form-label">管理员账号</label>
            <input class="form-control form-control-sm" name="admin_user" required></div>
          <div class="col-auto"><label class="form-label">管理员密码</label>
            <input class="form-control form-control-sm" name="admin_pass" required></div>
          <div class="col-auto"><button class="btn btn-sm btn-primary">创建租户</button></div>
        </form>
      </div></div>
      <div class="table-responsive"><table class="table table-sm bg-white">
        <thead><tr><th>编码</th><th>名称</th><th>状态</th><th>创建时间</th><th></th></tr></thead>
        <tbody>
        {{range .Data.Tenants}}
        <tr>
          <td>{{.Code}}</td><td>{{.Name}}</td>
          <td><span class="badge {{if eq .Status "active"}}bg-success{{else}}bg-secondary{{end}}">{{.Status}}</span></td>
          <td>{{date .CreatedAt}}</td>
          <td>
            <form method="post" action="/sysadmin/tenants/{{hex .ID}}/toggle" class="m-0">
              <input type="hidden" name="_csrf" value="{{$.CSRF}}">
              <button class="btn btn-sm btn-outline-{{if eq .Status "active"}}danger{{else}}success{{end}}">
                {{if eq .Status "active"}}停用{{else}}启用{{end}}
              </button>
            </form>
          </td>
        </tr>
        {{end}}
        </tbody>
      </table></div>
    </main>
  </div>
</div>
{{template "partial/foot" .}}
</body>
</html>
{{end}}
