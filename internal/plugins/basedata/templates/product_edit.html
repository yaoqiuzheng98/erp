{{define "basedata/product_edit"}}
<!DOCTYPE html>
<html lang="zh-CN">
{{template "partial/head" .}}
<body>
<div class="d-flex">
  {{template "partial/appnav" .}}
  <div class="flex-grow-1">
    {{template "partial/apptop" .}}
    <main class="p-2 p-md-4">
      {{template "partial/flash" .}}
      <h4 class="mb-3">编辑商品 {{.Data.P.Code}}</h4>
      <div class="card" style="max-width:560px"><div class="card-body">
        <form method="post" action="/app/basedata/products/{{hex .Data.P.ID}}">
          <input type="hidden" name="_csrf" value="{{.CSRF}}">
          <div class="mb-2"><label class="form-label">编码</label>
            <input class="form-control form-control-sm" value="{{.Data.P.Code}}" disabled></div>
          <div class="mb-2"><label class="form-label">名称</label>
            <input class="form-control form-control-sm" name="name" value="{{.Data.P.Name}}" required></div>
          <div class="mb-2"><label class="form-label">单位</label>
            <input class="form-control form-control-sm" name="unit" value="{{.Data.P.Unit}}"></div>
          <div class="mb-2"><label class="form-label">分类</label>
            <input class="form-control form-control-sm" name="category" value="{{.Data.P.Category}}"></div>
          <div class="mb-2"><label class="form-label">规格</label>
            <input class="form-control form-control-sm" name="spec" value="{{.Data.P.Spec}}"></div>
          <div class="mb-2"><label class="form-label">单价</label>
            <input class="form-control form-control-sm" name="price" type="number" step="0.01" value="{{.Data.P.Price}}"></div>
          <div class="mb-3"><label class="form-label">库存下限</label>
            <input class="form-control form-control-sm" name="min_stock" type="number" step="0.01" value="{{.Data.P.MinStock}}"></div>
          <button class="btn btn-sm btn-primary">保存</button>
          <a class="btn btn-sm btn-outline-secondary" href="/app/basedata/products">返回</a>
        </form>
      </div></div>
    </main>
  </div>
</div>
{{template "partial/foot" .}}
</body>
</html>
{{end}}
