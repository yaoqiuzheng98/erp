[server]
addr = ":8080"

[mongo]
uri = "mongodb://localhost:27017"
database = "erp"

[session]
ttl_hours = 12
cookie_name = "erp_sid"
sys_cookie_name = "erp_sys"
secure = false                # HTTPS 部署置 true，cookie 加 Secure 标记

[storage]
max_image_mb = 10             # 图片上传上限（MB），文件本体存 MongoDB GridFS

[seed]
enabled = true                # 首次启动时写入种子数据
sysadmin_user = "admin"       # 系统超管账号
sysadmin_pass = "admin123"
