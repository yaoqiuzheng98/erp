# 镜像部署：本地 docker build + docker save 打包上传，服务器 docker load 后直接跑。
# 用法：
#   本地:  docker build -t erp-app:latest . && docker save erp-app:latest | gzip > erp-app.tar.gz
#   上传:  scp erp-app.tar.gz root@<host>:/opt/erp/
#   服务器: docker load < erp-app.tar.gz && docker compose -f compose.image.yaml up -d
services:
  mongo:
    image: mongo:7
    container_name: erp-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12

  erp:
    image: erp-app:latest
    container_name: erp-app
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./config.prod.toml:/opt/erp/config.toml:ro
      - erp_uploads:/opt/erp/data/uploads
      - ./backups:/opt/erp/backups

  caddy:
    image: caddy:2-alpine
    container_name: erp-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - erp

volumes:
  mongo_data:
  erp_uploads:
  caddy_data:
  caddy_config:
