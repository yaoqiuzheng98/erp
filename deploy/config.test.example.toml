# 测试环境配置样例：复制为 config.test.toml 后修改密钥（不入库）
# 对应 compose.yaml 的 erp-test 服务，域名 erp.test.dokodemo.top
[server]
addr = ":8080"                # 容器内监听，经 caddy 按域名反代

[mongo]
uri = "mongodb://mongo:27017" # 复用生产 mongo 容器，换库隔离
database = "erp_test"

[session]
ttl_hours = 12
cookie_name = "erp_sid"
sys_cookie_name = "erp_sys"
secret = "REPLACE-WITH-STRONG-RANDOM"   # 测试环境单独生成，勿与生产共用
secure = true                           # HTTPS 下必须 true

[storage]
max_image_mb = 10                   # 图片上传上限（MB），文件本体存 MongoDB GridFS，随库备份

[log]
level = "info"

[seed]
enabled = true                # 测试环境保持 true，空库自动建超管
sysadmin_user = "admin"
sysadmin_pass = "REPLACE-ME"
demo_tenant = false            # 不再创建演示租户
demo_admin_user = "admin"
demo_admin_pass = "admin123"
