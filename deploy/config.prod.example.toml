# 生产配置样例：复制为 config.prod.toml 后修改密钥（不入库）
[server]
addr = ":8080"                # compose 内部端口，经 caddy 反代暴露

[mongo]
uri = "mongodb://mongo:27017" # compose 服务名直连，不对外暴露
database = "erp"

[session]
ttl_hours = 12
cookie_name = "erp_sid"
sys_cookie_name = "erp_sys"
secure = true                           # HTTPS 下必须 true

[storage]
max_image_mb = 10                   # 图片上传上限（MB），文件本体存 MongoDB GridFS，随库备份

[seed]
enabled = true                # 首次启动建超管后改 false 并重启
sysadmin_user = "admin"
sysadmin_pass = "REPLACE-ME"
