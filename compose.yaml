# 生产部署（唯一方式）：本地 docker build 打镜像，docker save 上传，服务器 docker load 后直接跑。
# 用法：
#   本地:  docker build -t erp-app:latest . && docker save erp-app:latest | gzip > erp-app.tar.gz
#   上传:  scp erp-app.tar.gz root@<host>:/opt/erp/
#   服务器: docker load < erp-app.tar.gz && docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: erp-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 测试环境（唯一运行环境）：复用 mongo/caddy，单 app 容器。
  # 镜像 erp-app:test，库 erp_test，域名 erp.test.dokodemo.top。
  erp-test:
    image: erp-app:test
    container_name: erp-test
    restart: always
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./config.test.toml:/opt/erp/config.toml:ro
      - erp_test_uploads:/opt/erp/data/uploads

  caddy:
    image: caddy:2-alpine
    container_name: erp-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - erp-test

volumes:
  mongo_data:
  erp_uploads:
  erp_test_uploads:
  caddy_data:
  caddy_config:
